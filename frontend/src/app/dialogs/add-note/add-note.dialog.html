<dialog #dialog class="dialog" aria-labelledby="note-title" (cancel)="cancel($event)">
  <form class="dialog__panel" (submit)="save($event, location.value, note.value)">
    <div class="dialog__grabber" aria-hidden="true"></div>
    <div class="dialog__toolbar">
      @if (connected()) {
        <g-emergency-stop-button (pressed)="stop()" />
      }
      <button
        class="btn btn--ghost btn--icon"
        type="button"
        aria-label="Close"
        [disabled]="busy()"
        (click)="cancel()"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m18 6-12 12M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="dialog__header">
      <h2 class="dialog__title" id="note-title">Add to this investigation</h2>
    </div>
    <div class="dialog__body stack">
      @if (error(); as failure) {
        <div #errorSummary class="alert alert--danger" role="alert" tabindex="-1">
          <div class="alert__body">
            <p class="alert__title">{{ failure.title }}</p>
            <p>{{ failure.message }}</p>
          </div>
        </div>
      }
      <label class="field">
        <span class="field__label">Location <span class="optional">(optional)</span></span>
        <input
          #location
          class="input"
          type="text"
          [value]="initial().location"
          autocomplete="off"
          aria-describedby="location-help"
        />
        <span class="field__help" id="location-help"
          >Typed by you. Gattsby never looks up where you are.</span
        >
      </label>
      <label class="field">
        <span class="field__label">Note</span>
        <textarea #note class="textarea" rows="3" [value]="initial().note"></textarea>
      </label>
    </div>
    <div class="dialog__footer">
      <button class="btn btn--lg" type="button" [disabled]="busy()" (click)="cancel()">
        Cancel
      </button>
      <button class="btn btn--primary btn--lg" type="submit" [disabled]="busy()">Save</button>
    </div>
  </form>
</dialog>
