# Lint, format, the production build, the bundle and header checks, and one critical behaviour
# spec per feature (AGENTS.md "CI"). Unit tests run locally. Must stay green and under 5 minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  queue: max

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate the knowledge base and lint (FR-069)
        run: npm run lint

      - name: Build for production
        run: npm run build

      - name: Check the initial bundle (250 KB gzip, NFR-004)
        run: npm run check:bundle

      - name: Check the security headers (NFR-013, NFR-014)
        run: |
          node scripts/serve-dist.ts --port 4400 &
          for attempt in $(seq 1 40); do
            curl --silent --fail http://localhost:4400/ > /dev/null && break
            sleep 0.25
          done
          npm run check:headers -- http://localhost:4400/

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium

      # The tagged critical paths cover the app shell, standard identification and live FTMS confirmation.
      - name: Run the critical behaviour specs
        run: npm run e2e:critical

      - name: Prepare Azure routing and security headers
        if: github.event_name == 'push'
        run: node scripts/configure-azure.ts

      - name: Deploy the tested frontend to Azure
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        id: deploy
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist/frontend/browser
          skip_app_build: true

      - name: Check production routes and security headers
        if: github.event_name == 'push'
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: npm run check:headers -- "${SITE_URL:?Missing deployment URL}"
