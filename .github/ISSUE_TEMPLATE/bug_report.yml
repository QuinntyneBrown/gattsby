name: Bug report
description: Something in Gattsby does not work as the requirements say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not report a security vulnerability here; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Gattsby and start an investigation
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Name the requirement in docs/specs/L2.md if you know it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capabilities and model (Prompt API, download, checklist mode)
        - Finding and connecting to a device
        - Identifying a device (GATT, Device Information, knowledge base)
        - Listening and decoding
        - Control commands and emergency stop
        - Device profiles, import and export
        - Documentation, mocks or design system
        - Build or CI
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Full agent mode
        - Checklist mode
        - Not sure
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The device's maker and model, your operating system, your Chrome version, and the commit you ran.
  - type: textarea
    id: logs
    attributes:
      label: Investigation record, logs or screenshots
      description: >-
        For anything about a device, export the investigation and attach it. It holds the device's name and
        identifiers and any location label you typed; read it before you share it.
      render: text
